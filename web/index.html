<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>買い物かご | copilot_sample_ec</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="cart">
    <header class="cart-head">
      <h1>買い物かご</h1>
      <label class="member"><input type="checkbox" id="member" checked> 会員でログイン中</label>
    </header>
    <ul id="items" class="items">
      <li class="hint">この画面は、ターミナルで <code>npm run dev</code> を実行し、表示された <code>http://localhost:5173/</code> をブラウザで開くと動きます。HTML ファイルを直接開いても、計算は動きません。</li>
    </ul>
    <div class="coupon">
      <label for="coupon">クーポン</label>
      <input id="coupon" placeholder="例: SAVE500" autocomplete="off">
    </div>
    <dl id="summary" class="summary"></dl>
    <p id="error" class="error" hidden></p>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
