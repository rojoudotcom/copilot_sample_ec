name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: 型検査とテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 型検査
        run: npm run typecheck
      - name: テスト
        run: npm test
