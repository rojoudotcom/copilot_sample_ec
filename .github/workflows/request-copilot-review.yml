name: Copilot にレビューを頼む

# CI（型検査とテスト）が PR で成功したら、その PR のレビューを Copilot に頼む
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  request-review:
    name: CI が通った PR に Copilot のレビューを頼む
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Copilot をレビュアーに指定する
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh --version | head -1
          pr=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "ブランチ $HEAD_BRANCH の PR が見つかりません"
            exit 0
          fi
          gh pr edit "$pr" --add-reviewer @copilot
          echo "PR #$pr のレビューを Copilot に頼みました"
